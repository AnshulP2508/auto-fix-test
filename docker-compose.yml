services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DEV_DB_URL: postgres://lab:lab@postgres:5432/lab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: lab-only-jwt-secret
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ORG: ${SENTRY_ORG}
      SENTRY_PROJECT_BACKEND: ${SENTRY_PROJECT_BACKEND}
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:3001
      NEXT_PUBLIC_SOCKET_URL: wss://localhost:3443
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION}
      SENTRY_ORG: ${SENTRY_ORG}
      SENTRY_PROJECT_FRONTEND: ${SENTRY_PROJECT_FRONTEND}
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
      - "3443:3443"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
